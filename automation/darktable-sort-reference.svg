<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-labelledby="title description">
  <title id="title">darktable 5.6 custom sort direction reference</title>
  <desc id="description">Ascending uses a fixed downward arrow with bars growing longer from top to bottom. Descending uses the same arrow with bars shrinking from top to bottom.</desc>
  <rect width="920" height="420" rx="24" fill="#202225"/>
  <text x="460" y="52" fill="#f3f4f6" font-family="Segoe UI, sans-serif" font-size="26" font-weight="600" text-anchor="middle">darktable 5.6 · custom sort direction</text>
  <text x="460" y="82" fill="#aeb4bc" font-family="Segoe UI, sans-serif" font-size="17" text-anchor="middle">The arrow stays pointed down. Read the horizontal bars.</text>

  <g transform="translate(44 112)">
    <rect width="392" height="260" rx="18" fill="#2b2e33" stroke="#454a52"/>
    <text x="196" y="42" fill="#80d4a8" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle">ASCENDING</text>
    <g transform="translate(44 68) scale(1.38)" fill="none" stroke="#f3f4f6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 5V95 M0 80L10 95L20 80"/>
      <path d="M35 5H45 M35 35H65 M35 65H85 M35 95H100"/>
    </g>
    <text x="226" y="112" fill="#f3f4f6" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600">short bars at top</text>
    <text x="226" y="145" fill="#f3f4f6" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600">long bars at bottom</text>
    <text x="196" y="226" fill="#80d4a8" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Use this for website sequencing</text>
  </g>

  <g transform="translate(484 112)">
    <rect width="392" height="260" rx="18" fill="#2b2e33" stroke="#454a52"/>
    <text x="196" y="42" fill="#f0ad78" font-family="Segoe UI, sans-serif" font-size="24" font-weight="700" text-anchor="middle">DESCENDING</text>
    <g transform="translate(44 68) scale(1.38)" fill="none" stroke="#f3f4f6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 5V95 M0 80L10 95L20 80"/>
      <path d="M35 5H100 M35 35H85 M35 65H65 M35 95H45"/>
    </g>
    <text x="226" y="112" fill="#f3f4f6" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600">long bars at top</text>
    <text x="226" y="145" fill="#f3f4f6" font-family="Segoe UI, sans-serif" font-size="19" font-weight="600">short bars at bottom</text>
    <text x="196" y="226" fill="#f0ad78" font-family="Segoe UI, sans-serif" font-size="18" font-weight="600" text-anchor="middle">Website view would be reversed</text>
  </g>

  <text x="460" y="402" fill="#8f969f" font-family="Segoe UI, sans-serif" font-size="14" text-anchor="middle">Exact glyph geometry reconstructed from darktable 5.6.0 dtgtk_cairo_paint_sortby</text>
</svg>
